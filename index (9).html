<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가입 시 안내사항 확인 | Cruise Club</title>
<meta name="description" content="크루즈 멤버십 가입 전에 꼭 알아야 할 8가지를 읽고 확인해 주세요">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kbellalee4808-star.github.io/Join_check/">
<meta property="og:title" content="가입 시 안내사항 확인">
<meta property="og:description" content="꼭 알아야 할 8가지 · 읽고 체크하면 확인 완료">
<meta property="og:image" content="https://kbellalee4808-star.github.io/-3.X/hero-ship.jpg">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'GmarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap;}
:root{--navy:#1B3A5C;--gold:#D4A94A;--ivory:#FAF7F2;--ink:#22303d;--muted:#6b7785;--line:#e6dfd2;--sky:#eef4fa;--red:#c0392b;--green:#1a7a4a;}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--ivory);color:var(--ink);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;-webkit-tap-highlight-color:transparent;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 48px;}
header{background:var(--navy);color:#fff;padding:32px 22px 28px;margin:0 -18px 20px;}
.back[hidden]{display:none;}.back{display:inline-block;color:var(--gold);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:16px;}
.ov{color:var(--gold);font-family:'GmarketSans',sans-serif;font-size:12px;letter-spacing:1px;margin-bottom:6px;}
h1{font-family:'GmarketSans','Noto Sans KR',sans-serif;font-size:25px;line-height:1.4;}
header p{color:rgba(255,255,255,.8);font-size:14px;margin-top:10px;}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ivory);padding:10px 0;margin-bottom:6px;}
.bar{height:8px;background:#e8e2d6;border-radius:8px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s;}
.prog p{font-size:13px;font-weight:700;color:var(--navy);margin-top:6px;}
.item{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;}
.item input{position:absolute;opacity:0;width:1px;height:1px;}
.box{flex:none;width:30px;height:30px;border:2.5px solid #c9c0ae;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;margin-top:2px;}
.item.on{border-color:var(--green);background:#f3faf6;}
.item.on .box{background:var(--green);border-color:var(--green);}
.item:focus-within{outline:3px solid var(--gold);outline-offset:2px;}
.it b{display:block;color:var(--navy);font-size:16px;}
.it span{font-size:14px;color:var(--muted);}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:18px;}
.card h2{font-family:'GmarketSans','Noto Sans KR',sans-serif;font-size:17px;color:var(--navy);margin-bottom:14px;}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px;}
label:first-of-type{margin-top:0;}
.req{color:var(--red);}
input[type=text],input[type=tel]{width:100%;font:700 18px 'Noto Sans KR',sans-serif;color:var(--navy);border:2px solid #d8d0c0;border-radius:12px;padding:12px 14px;background:#fff;-webkit-appearance:none;}
input[type=text]:focus,input[type=tel]:focus{outline:none;border-color:var(--navy);}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:16px;padding:12px 14px;background:var(--sky);border-radius:12px;cursor:pointer;}
.agree input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--navy);}
.submit{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:18px;background:var(--navy);color:#fff;font-weight:900;font-size:17px;border-radius:14px;cursor:pointer;}
.submit[disabled]{background:#b8c2cc;cursor:not-allowed;}
.submit:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.msg{font-size:13px;color:var(--red);text-align:center;margin-top:10px;min-height:20px;}
.done{display:none;text-align:center;padding:40px 10px;}
.done .big{font-size:56px;}
.done h2{font-family:'GmarketSans','Noto Sans KR',sans-serif;color:var(--navy);font-size:22px;margin:10px 0;}
.done p{color:var(--muted);font-size:15px;}
.again{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;margin-top:22px;border:2px solid var(--navy);color:var(--navy);font-weight:900;border-radius:14px;cursor:pointer;}
.it b em{font-style:normal;color:#C2503A;}
.it .tag{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--red);color:#fff;font-size:11px;font-weight:900;letter-spacing:.5px;}
.more{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-top:6px;padding:0 12px;border:1.5px solid #e2d3b0;border-radius:10px;background:#fbf6ea;color:#7a5a12;font-size:13px;font-weight:700;cursor:pointer;}
.more:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.more i{font-style:normal;transition:transform .2s;}
.more[aria-expanded="true"] i{transform:rotate(180deg);}
.panel{margin-top:10px;padding:12px 14px;border-radius:12px;background:#fbf6ea;font-size:13px;line-height:1.75;color:#4a3d22;cursor:default;}
.panel[hidden]{display:none;}
.panel p{margin-bottom:6px;}
.it .panel b{display:inline;font-size:inherit;color:#7a5a12;}
.panel ul{list-style:none;}
.panel li{position:relative;padding-left:12px;margin-top:4px;}
.panel li::before{content:'·';position:absolute;left:2px;font-weight:900;}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="back" id="backHub" hidden href="https://kbellalee4808-star.github.io/cruiseclub_hub/">‹ 크루즈 허브로</a>
  <div class="ov">BEFORE YOU JOIN</div>
  <h1>가입 시 안내사항 확인</h1>
  <p>아래 8가지를 하나씩 읽고 눌러서 체크해 주세요.</p>
</header>

<main id="form">
<div class="prog"><div class="bar"><i id="bar"></i></div><p id="cnt">0 / 8 확인</p></div>

<div id="list"></div>

<section class="card">
  <h2>확인한 분</h2>
  <label for="nm">이름 <span class="req">*</span></label>
  <input id="nm" type="text" autocomplete="name" placeholder="홍길동">
  <label for="ph">휴대폰 번호 뒤 4자리 <span class="req">*</span></label>
  <input id="ph" type="tel" inputmode="numeric" maxlength="4" placeholder="1234">
  <label for="ld">추천해 준 리더</label>
  <input id="ld" type="text" placeholder="리더 이름 (모르면 비워두세요)">
  <label class="agree"><input id="ok" type="checkbox"><span>위 내용을 모두 읽고 이해했습니다.</span></label>
  <button class="submit" id="send" type="button" disabled>확인 완료 제출하기</button>
  <p class="msg" id="msg" role="status"></p>
</section>
<p class="note">이름, 번호 뒤 4자리, 확인한 시각만 기록됩니다.</p>
</main>

<section class="done" id="done">
  <div class="big">🎉</div>
  <h2>확인이 완료됐어요</h2>
  <p id="doneName"></p>
  <button class="again" id="again" type="button">다음 분 작성하기</button>
</section>
</div>

<script>
/* ▼ 구글 시트 연결 주소 — Apps Script 배포 후 받은 웹 앱 URL을 넣어주세요 */
var SHEET_URL = 'https://script.google.com/macros/s/AKfycbzwrOxvWPFpWSTiAmnzanl5CamDiNtat1CdltXlsTWc8nrHj55HXPbFTs-Putk3DSG5_A/exec';

var ITEMS=[
 ['정시 납부 (<em>5일 안</em>)','결제일로부터 5일 안에 내야 2배 리워드 적립이 유지돼요.'],
 ['환불은 가입 후 <em>14일</em> 안에만','14일이 지나면 환불되지 않아요.'],
 ['<em>30일</em> 미납 시 <em>비활성화</em>','30일 넘게 안 내면 계정이 비활성화돼요. 낸 금액은 사라지지 않고 이후 17%씩 차감해 쓸 수 있어요.'],
 ['리워드는 <em>현금으로 돌려받지 않아요</em>','리워드는 크루즈 예약에만 쓰여요.'],
 ['1기기 <em>1계정</em>만 사용','한 기기에서는 한 계정만 사용해요.'],
 ['예약과 계정 관리는 <em>본인이 직접</em>','예약, 결제, 비밀번호 관리는 스스로 해요.'],
 ['예약 후에는 <em>취소 · 변경이 안 돼요</em>','개인 사정이 생겨도 취소하거나 바꿀 수 없어요. 일정이 확실할 때 예약해 주세요.',0,
  {btn:'💡 리워드 보험으로 대비하기 · 조건',
   lead:'멤버십 사이트에서 예약할 때 <b>리워드 보험</b>을 함께 들어두시면, 사정이 생겼을 때 리워드와 결제 금액을 돌려받을 수 있어요.',
   list:['증빙서류를 낼 수 있는 경우에만 돌려받을 수 있어요. 단순 변심이나 증빙이 어려운 경우는 해당되지 않아요.',
         '서류는 출발 60일 전까지, 사이트의 <b>지원요청</b>으로 본인이 직접 내야 해요.',
         '함께 예약한 분까지 예약 전체가 취소돼요.']}],
 ['자동결제는 해외결제 VISA · Mastercard','국내 전용 카드는 등록되지 않아요.']
];
var list=document.getElementById('list');
ITEMS.forEach(function(t,i){
  var l=document.createElement('label');l.className='item';
  var title='<b>'+(i+1)+'. '+t[0]+'</b>';
  var extra='';
  if(t[3]&&t[3].href){
    extra='<a class="more" href="'+t[3].href+'" target="_blank" rel="noopener">'+t[3].btn+' <i>›</i></a>';
  }else if(t[3]){
    extra='<button type="button" class="more" aria-expanded="false" aria-controls="more'+i+'">'+t[3].btn+' <i>▾</i></button>'
      +'<div class="panel" id="more'+i+'" hidden><p>'+t[3].lead+'</p><ul><li>'+t[3].list.join('</li><li>')+'</li></ul></div>';
  }
  l.innerHTML='<input type="checkbox" data-i="'+i+'"><span class="box" aria-hidden="true">✓</span><span class="it">'+title+'<span>'+t[1]+'</span>'+extra+'</span>';
  list.appendChild(l);
  if(t[3]&&t[3].href){
    l.querySelector('.more').addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      /* 새 창이 막힌 환경(일부 앱 안 브라우저)에서는 같은 창으로 열어요 */
      var w=null;try{w=window.open(this.href,'_blank');if(w)w.opener=null;}catch(err){}
      if(!w)location.href=this.href;
    });
  }else if(t[3]){
    var mb=l.querySelector('.more'),pn=l.querySelector('.panel');
    /* 버튼과 설명을 눌러도 체크가 되지 않게 막아요 */
    mb.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var open=mb.getAttribute('aria-expanded')!=='true';mb.setAttribute('aria-expanded',open);pn.hidden=!open;});
    pn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();});
  }
});
var boxes=list.querySelectorAll('input'),nm=document.getElementById('nm'),ph=document.getElementById('ph'),ld=document.getElementById('ld'),ok=document.getElementById('ok'),send=document.getElementById('send'),msg=document.getElementById('msg');
function upd(){
  var n=0;boxes.forEach(function(b){b.closest('.item').classList.toggle('on',b.checked);if(b.checked)n++;});
  document.getElementById('bar').style.width=(n/ITEMS.length*100)+'%';
  document.getElementById('cnt').textContent=n+' / '+ITEMS.length+' 확인';
  ph.value=ph.value.replace(/\D/g,'').slice(0,4);
  send.disabled=!(n===ITEMS.length&&nm.value.trim()&&ph.value.length===4&&ok.checked);
}
[].forEach.call(boxes,function(b){b.addEventListener('change',upd);});
[nm,ph,ld].forEach(function(e){e.addEventListener('input',upd);});ok.addEventListener('change',upd);

function device(){var u=navigator.userAgent;if(/iPad/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return '아이패드';if(/iPhone/.test(u))return '아이폰';if(/Android/.test(u))return '안드로이드';return '컴퓨터';}
function post(d){return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});}
/* 인터넷이 끊겼을 때 기기에 잠시 보관했다가 다음에 다시 보내요 */
function queue(){try{return JSON.parse(localStorage.getItem('jc_queue')||'[]');}catch(e){return [];}}
function saveQ(q){try{localStorage.setItem('jc_queue',JSON.stringify(q));}catch(e){}}
function flush(){var q=queue();if(!q.length||SHEET_URL.indexOf('http')!==0)return;var d=q[0];post(d).then(function(){q.shift();saveQ(q);flush();}).catch(function(){});}

send.addEventListener('click',function(){
  if(send.disabled)return;
  if(SHEET_URL.indexOf('http')!==0){msg.textContent='아직 구글 시트가 연결되지 않았어요. 리더에게 알려주세요.';return;}
  var d={name:nm.value.trim(),phone4:ph.value,leader:ld.value.trim(),items:ITEMS.length+'/'+ITEMS.length,device:device(),at:new Date().toISOString()};
  send.disabled=true;send.textContent='보내는 중…';msg.textContent='';
  post(d).catch(function(){var q=queue();q.push(d);saveQ(q);}).then(function(){
    document.getElementById('form').style.display='none';
    document.getElementById('doneName').textContent=d.name+'님, 감사합니다.';
    document.getElementById('done').style.display='block';window.scrollTo(0,0);
  });
});
document.getElementById('again').addEventListener('click',function(){
  [].forEach.call(boxes,function(b){b.checked=false;});nm.value='';ph.value='';ld.value='';ok.checked=false;
  send.textContent='확인 완료 제출하기';msg.textContent='';
  document.getElementById('done').style.display='none';document.getElementById('form').style.display='block';upd();window.scrollTo(0,0);
});
if(document.referrer.indexOf('cruiseclub_hub')>-1){document.getElementById('backHub').hidden=false;}
upd();flush();
</script>
</body>
</html>
